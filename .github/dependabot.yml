version: 2
updates:
  # Bun dependencies (bun.lock): one PR a month. Security fixes come
  # separately from Dependabot security updates, off this schedule.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      dependencies:
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
